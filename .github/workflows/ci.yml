name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        # No override: the threshold lives in package.json so the command a
        # person runs and the one CI runs cannot disagree. It was 0 locally and
        # 500 in CI against a real count of 328 - two numbers both claiming to
        # be the standard, and neither of them true. 350 leaves a little room
        # and ratchets: bring the count down and lower it again.
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      # The vendored doctrine kit must match its manifest (never edit doctrine/kit/ here;
      # change [local path] and sync), and the registers must pass the kit's checks.
      - name: Doctrine kit copy and registers (tic-doctrine)
        run: python3 doctrine/kit/tic.py kitcheck && python3 doctrine/kit/tic.py registers doctrine

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # Playwright's own image: browsers and their system packages are already
    # installed. `playwright install --with-deps` fetched webkit's packages from
    # the runner's Ubuntu mirror, which served about 60 kB/s on 18 Nov 2026 and
    # ran PR #1's webkit job into this 20-minute timeout twice. Keep the tag at
    # the @playwright/test version in package-lock.json. HOME=/root is what
    # Playwright's CI docs require for Firefox in this container.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A no-op while the image tag matches package-lock.json. If a Playwright
      # bump lands before the tag does, this downloads the matching browser
      # (from Playwright's CDN, not apt) instead of failing on a missing one.
      - name: Check Playwright browser (${{ matrix.browser }})
        run: npx playwright install ${{ matrix.browser }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Deliberately not the real project. e2e/support/supabase.js intercepts
      # every Supabase request and demo mode supplies the fixtures, so the suite
      # needs no database - and pointing it at an address that cannot resolve
      # means a stub that is ever missed fails loudly here rather than making
      # the run depend on live data. Before this, every test loaded the landing
      # page against production and the suite's result depended on what else was
      # touching Supabase: three merge cycles were lost to it on 20 September.
      - name: Run E2E tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          VITE_SUPABASE_URL: https://e2e-must-not-reach-production.invalid
          VITE_SUPABASE_ANON_KEY: e2e-placeholder-not-a-real-key

      - name: Upload Playwright report (${{ matrix.browser }})
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (${{ matrix.browser }})
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
