version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Group minor and patch updates together
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    # Majors: no version-update PRs at all (12 November 2026). Ungrouped, seven
    # piled up by 21 September; grouped, they made one PR of 23 updates (#95)
    # that could never merge, because npm ci fails on it and ESLint 10,
    # Tailwind 4, React Router 7, Recharts 3 and Vite 8 each need a hand
    # migration. Each major is now done by hand on its own branch. Security
    # updates are separate from version updates and still arrive.
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # No grouping at all here until 21 September, which is why five separate
      # PRs were open to bump five `uses:` lines. They only touch CI and they
      # move together, so they are one PR.
      github-actions:
        patterns:
          - '*'
