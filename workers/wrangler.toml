# Cloudflare Workers Configuration for Vigil
# Deploy: npx wrangler deploy
# Test locally: npx wrangler dev

name = "vigil-ingestion"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cron trigger - this replaces GitHub Actions schedules.
#
# The trigger runs the scheduler over the registry; it does not own a list of
# feeds. What runs is decided by which jobs are overdue
# (workers/src/feeds/registry.js) and how much of the 50-subrequest budget is
# left. So this is a tick, not a schedule: more ticks drain the backlog faster,
# and a feed's cadence is set in the registry.
#
# One trigger, at :15 and :45: 48 ticks a day, room for about 1,536 subrequests
# against the roughly 900 the registry declares. Until 6 Nov 2026 there were four
# triggers (15 * * * *, 0 */6 * * *, 0 3 * * *, 0 4 * * SUN): about 29 ticks, room
# for about 930. An hourly trigger alone (768) would be too few.
# workers/src/lib/__tests__/capacity.test.js fails if the registry outgrows it.
#
# Workers Free allows 5 cron triggers per account, shared with the account's
# other Workers. Using one leaves them four.
[triggers]
crons = ["15,45 * * * *"]

# Environment variables (set via `wrangler secret put`)
# SUPABASE_URL
# SUPABASE_KEY
# PULSEDIVE_API_KEY
# VULNCHECK_API_KEY
# CENSYS_API_KEY

[vars]
ENVIRONMENT = "production"
