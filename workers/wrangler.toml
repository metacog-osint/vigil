# Cloudflare Workers Configuration for Vigil
# Deploy: npx wrangler deploy
# Test locally: npx wrangler dev

name = "vigil-ingestion"
main = "src/index.js"
compatibility_date = "2024-01-01"
# AsyncLocalStorage, which carries each invocation's subrequest budget through
# the fetch meter (src/lib/subrequests.js).
compatibility_flags = ["nodejs_als"]

# Cron trigger - this replaces GitHub Actions schedules.
#
# The trigger runs the scheduler over the registry; it does not own a list of
# feeds. What runs is decided by which jobs are overdue
# (workers/src/feeds/registry.js) and how much of the invocation's subrequest
# budget is left (src/lib/limits.js). So this is a tick, not a schedule: more
# ticks drain the backlog faster, and a feed's cadence is set in the registry.
#
# One trigger, at :15 and :45: 48 ticks a day. Until 6 Nov 2026 there were four
# triggers (15 * * * *, 0 */6 * * *, 0 3 * * *, 0 4 * * SUN). On Workers Free
# (50 subrequests a tick) capacity was what limited this; on Workers Paid, from
# 17 Nov 2026, it is not. workers/src/lib/__tests__/capacity.test.js still
# fails if the registry outgrows the ticks, and holds the due-early slack to
# half the gap between them.
[triggers]
crons = ["15,45 * * * *"]

# Environment variables (set via `wrangler secret put`)
# SUPABASE_URL
# SUPABASE_KEY
# PULSEDIVE_API_KEY
# CENSYS_API_KEY

[vars]
ENVIRONMENT = "production"
